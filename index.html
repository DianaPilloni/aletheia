<title>Telefono di Giulia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: un telefono Android 2013 (tema Holo) al centro; su smartphone occupa tutto lo schermo */
:root{
  --desk:#15171a; --frame:#0a0a0b; --screen:#000; --surface:#1d1f22; --line:#2e3135;
  --fg:#e9eaec; --muted:#8d939a; --accent:#33b5e5; --alert:#ff4444; --bubble-me:#1f4f63;
  --f-ui:"Roboto",system-ui,sans-serif; --f-cond:"Roboto Condensed","Roboto",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:360px;max-width:100%;height:700px;background:var(--frame);border-radius:34px;padding:56px 12px 64px;position:relative;box-shadow:0 0 0 2px #2a2c30,0 30px 60px rgba(0,0,0,.5)}
.phone::before{content:"";position:absolute;top:26px;left:50%;width:60px;height:6px;margin-left:-30px;border-radius:3px;background:#222}
.phone::after{content:"";position:absolute;bottom:18px;left:50%;width:44px;height:28px;margin-left:-22px;border-radius:6px;border:2px solid #222}
.screen{height:100%;background:var(--screen);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:24px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 8px;font-size:12px;background:#000;color:#cfd2d5}
.status .sig{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.status .sig i{width:3px;background:var(--accent);display:block}
.batt{width:9px;height:14px;border:1.5px solid #cfd2d5;border-radius:1px;position:relative}
.batt::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:20%;background:var(--alert)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
/* lock */
.lock{background:radial-gradient(120% 80% at 30% 10%,#123447 0%,#06121a 55%,#000 100%);align-items:center;padding:24px 16px}
.clock{font-weight:300;font-size:64px;letter-spacing:-1px;margin-top:18px}
.date{color:var(--accent);font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.notif{margin-top:14px;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:14px;margin:26px 0 16px}
.dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent)}
.dots span.on{background:var(--accent)}
.dots.err span{border-color:var(--alert)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px 22px}
.pad button{height:56px;border-radius:50%;font-size:26px;font-weight:300}
.pad button:active{background:rgba(51,181,229,.25)}
.pad small{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em;margin-top:-4px}
.lockmsg{min-height:18px;font-size:12px;color:var(--alert);margin-top:8px}
/* home */
.home{background:radial-gradient(100% 70% at 70% 0%,#173b2e 0%,#071510 60%,#000 100%);padding:28px 18px}
.homedate{font-family:var(--f-cond);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.hometime{font-size:44px;font-weight:300;margin-bottom:24px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.ico{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.5)}
.ico svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;background:var(--alert);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* app chrome */
.bar{flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 8px;background:var(--surface);border-bottom:2px solid var(--accent)}
.bar b{font-weight:400;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:36px;height:36px;display:grid;place-items:center}
.back svg{width:20px;height:20px;stroke:var(--accent);stroke-width:2.5;fill:none}
.scroll{flex:1;overflow-y:auto;min-height:0;background:#111315}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:active{background:rgba(51,181,229,.15)}
.av{width:40px;height:40px;flex:none;border-radius:2px;display:grid;place-items:center;font-family:var(--f-cond);font-size:18px;background:#38424a}
.rmain{flex:1;min-width:0}
.rtop{display:flex;justify-content:space-between;gap:8px}
.rname{font-size:15px}
.rtime{font-size:11px;color:var(--muted);white-space:nowrap}
.rsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .rsub{color:var(--fg)}
.unread .rtime{color:var(--accent)}
.sect{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent);padding:14px 14px 6px;border-bottom:1px solid var(--line)}
/* chat */
.chat{padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:11px;color:var(--muted);background:#1c1f22;padding:3px 10px;border-radius:2px;margin:8px 0}
.msg{max-width:80%;padding:7px 10px 5px;border-radius:3px;font-size:14px;line-height:1.35;background:#25292d}
.msg.me{align-self:flex-end;background:var(--bubble-me)}
.msg time{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:2px}
.msg.me time{color:#9cc6d6}
/* calls */
.cdir{width:22px;flex:none;text-align:center;font-size:16px}
.in{color:#99cc00}.out{color:var(--accent)}.miss{color:var(--alert)}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.ph{aspect-ratio:1;max-width:100%;display:grid;place-items:end start;padding:6px;font-size:10px;color:rgba(255,255,255,.75);text-align:left}
.big{aspect-ratio:4/3;max-width:100%;margin:12px;display:grid;place-items:center;font-size:13px;color:rgba(255,255,255,.8);text-align:center;padding:16px}
.meta{margin:0 14px;font-size:13px;line-height:1.6}
.meta dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-cond)}
.meta dd{margin:0 0 8px}
/* notes */
.note{padding:16px 16px;font-size:15px;line-height:1.55;white-space:pre-wrap;background:#f3edc9;color:#2c2a20;min-height:100%;font-family:var(--f-ui)}
.locked{padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.locked svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:2}
.locked input{width:100%;max-width:220px;background:#000;border:0;border-bottom:2px solid var(--accent);color:var(--fg);font-size:22px;text-align:center;letter-spacing:.3em;padding:8px}
.btn{background:var(--surface);border:1px solid var(--line);padding:10px 20px;font-size:14px}
.err{color:var(--alert);font-size:12px;min-height:16px}
/* map */
.tl{padding:10px 14px 20px}
.stop{display:grid;grid-template-columns:52px 16px 1fr;gap:10px;min-height:64px}
.stop .t{font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.stop .dot{position:relative}
.stop .dot::before{content:"";position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.stop .dot::after{content:"";position:absolute;left:7px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.stop:last-child .dot::after{display:none}
.stop.last .dot::before{background:var(--alert)}
.stop b{font-weight:500;font-size:14px;display:block}
.stop span{font-size:12px;color:var(--muted)}
.mapimg{height:140px;margin:0;background:
  linear-gradient(90deg,transparent 48%,#2b3a2e 48%,#2b3a2e 52%,transparent 52%),
  linear-gradient(0deg,transparent 30%,#33403a 30%,#33403a 33%,transparent 33%),
  linear-gradient(35deg,transparent 60%,#3a4a3f 60%,#3a4a3f 63%,transparent 63%),#1b241e;position:relative}
.mapimg i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #000}
@media (max-width:520px){
  body{padding:0}
  .wrap{display:block}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .phone::before,.phone::after{display:none}
  html,body{height:auto}
  .phone{height:100vh;height:100dvh}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:scale(.985)}}}
</style>

</div>

async function decrypt(p,code){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(p.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(p.i)},key,ub(p.c)));
}
async function tryDecrypt(p,code){try{return await decrypt(p,code)}catch(e){return null}}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let D=null; const opened={};

const ICONS={
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 pic:'<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
 note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',
 map:'<path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',
 mail:'<rect x="3" y="6" width="18" height="13"/><path d="M3 7l9 7 9-7"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 lock:'<rect x="5" y="11" width="14" height="10"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24">${ICONS[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

const $=s=>document.querySelector(s);
const scr=$("#screen");
const status=()=>`<div class="status"><span class="sig"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:11px;opacity:.3"></i></span><span>3G</span><span class="batt"></span><span>22:47</span></div>`;
const bar=(title,backTo)=>`<div class="bar"><button class="back" data-go="${backTo}" aria-label="Indietro">${svg("back")}</button><b>${esc(title)}</b></div>`;

function render(view,arg){
 if(!D) view="lock";
 let h=status();
 if(view==="lock"){
  h+=`<div class="view lock"><div class="date">Lunedì 9 settembre</div><div class="clock">22:47</div>
   <div class="notif">2 messaggi · 2 chiamate perse</div>
   <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
   <div class="pad">${[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["",""],["0","+"],["⌫",""]].map(([n,l])=>n?`<button data-k="${n}" aria-label="${n==="⌫"?"Cancella":n}">${n}${l?`<small>${l}</small>`:""}</button>`:"<span></span>").join("")}</div>
   <div class="lockmsg" id="lm"></div></div>`;
 } else if(view==="home"){
  const unread=D.chats.reduce((a,c)=>a+c.unread,0);
  const apps=[["msg","Messaggi","#2a8a4a",unread],["call","Telefono","#2c6fa0",2],["pic","Galleria","#8a4a8a",0],["note","Note","#b8902a",0],["map","Posizioni","#b4503a",0],["mail","Email","#555d66",0]];
  h+=`<div class="view home"><div class="homedate">Lunedì 9 settembre 2013</div><div class="hometime">22:47</div>
   <div class="apps">${apps.map(([k,n,c,b])=>`<button class="app" data-go="${k}"><span class="ico" style="background:${c}">${svg(k)}${b?`<span class="badge">${b}</span>`:""}</span>${n}</button>`).join("")}</div></div>`;
 } else if(view==="msg"){
  h+=`<div class="view">${bar("Messaggi","home")}<div class="scroll">${D.chats.map(c=>{const last=c.msgs.filter(m=>m.length>1).pop();return `<button class="row ${c.unread?"unread":""}" data-go="chat" data-a="${c.id}"><span class="av" style="background:${c.color}">${esc(c.init)}</span><span class="rmain"><span class="rtop"><span class="rname">${esc(c.name)}</span><span class="rtime">${last[2]}</span></span><span class="rsub">${last[0]==="me"?"Tu: ":""}${esc(last[1])}</span></span></button>`}).join("")}</div></div>`;
 } else if(view==="chat"){
  const c=D.chats.find(x=>x.id===arg); c.unread=0;
  h+=`<div class="view">${bar(c.name,"msg")}<div class="scroll"><div class="chat">${c.msgs.map(m=>m.length===1?`<div class="day">${esc(m[0])}</div>`:`<div class="msg ${m[0]==="me"?"me":""}">${esc(m[1])}<time>${m[2]}</time></div>`).join("")}</div></div></div>`;
 } else if(view==="call"){
  const sym={in:"↙",out:"↗",miss:"↙"};
  h+=`<div class="view">${bar("Registro chiamate","home")}<div class="scroll">${D.calls.map(r=>r.length===1?`<div class="sect">${esc(r[0])}</div>`:`<div class="row"><span class="cdir ${r[0]}">${sym[r[0]]}</span><span class="rmain"><span class="rtop"><span class="rname">${esc(r[1])}</span><span class="rtime">${r[2]}</span></span><span class="rsub">${r[0]==="miss"?"Chiamata persa":(r[0]==="in"?"In entrata":"In uscita")+" · "+r[3]}</span></span></div>`).join("")}</div></div>`;
 } else if(view==="pic"){
  h+=`<div class="view">${bar("Galleria","home")}<div class="scroll"><div class="sect">Fotocamera · ${D.photos.length} elementi</div><div class="grid">${D.photos.map((p,i)=>`<button class="ph" style="background:${p.bg}" data-go="photo" data-a="${i}">${esc(p.c)}</button>`).join("")}</div></div></div>`;
 } else if(view==="photo"){
  const p=D.photos[arg];
  h+=`<div class="view">${bar(p.c,"pic")}<div class="scroll"><div class="big" style="background:${p.bg}">[ immagine segnaposto ]</div><dl class="meta"><dt>Scattata</dt><dd>${esc(p.d)}</dd><dt>Luogo</dt><dd>${esc(p.p)}</dd><dt>Descrizione</dt><dd>${esc(p.t)}</dd></dl></div></div>`;
 } else if(view==="note"){
  h+=`<div class="view">${bar("Note","home")}<div class="scroll">${D.notes.map(n=>{const lk=n.enc&&!opened[n.id];return `<button class="row" data-go="nota" data-a="${n.id}"><span class="rmain"><span class="rtop"><span class="rname">${esc(n.title)}</span><span class="rtime">${n.date}</span></span><span class="rsub">${lk?"Nota protetta":esc((n.text||opened[n.id]).split("\n")[0])}</span></span></button>`}).join("")}</div></div>`;
 } else if(view==="nota"){
  const n=D.notes.find(x=>x.id===arg); const txt=n.enc?opened[n.id]:n.text;
  if(txt==null){
   h+=`<div class="view">${bar(n.title,"note")}<div class="scroll"><form class="locked" id="nf">${svg("lock")}<div>Questa nota è protetta.<br>Inserisci il codice.</div><input id="ncode" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="Codice nota"><button class="btn" type="submit">Sblocca</button><div class="err" id="nerr"></div></form></div></div>`;
  } else h+=`<div class="view">${bar(n.title,"note")}<div class="scroll"><div class="note">${esc(txt)}</div></div></div>`;
 } else if(view==="map"){
  h+=`<div class="view">${bar("Cronologia posizioni","home")}<div class="scroll"><div class="mapimg"><i style="left:22%;top:30%"></i><i style="left:62%;top:58%"></i><i style="left:46%;top:20%"></i><i style="left:80%;top:72%;background:var(--alert)"></i></div><div class="sect">Lunedì 9 settembre 2013</div><div class="tl">${D.stops.map(s=>`<div class="stop ${s[3]?"last":""}"><span class="t">${s[0]}</span><span class="dot"></span><span><b>${esc(s[1])}</b><span>${esc(s[2])}</span></span></div>`).join("")}</div></div></div>`;
 } else if(view==="mail"){
  h+=`<div class="view">${bar("Email","home")}<div class="scroll">${D.mails.map(m=>`<div class="row"><span class="rmain"><span class="rtop"><span class="rname">${esc(m[0])}</span><span class="rtime">${m[1]}</span></span><span class="rsub">${esc(m[2])}</span></span></div>`).join("")}</div></div>`;
 }
 scr.innerHTML=h; bind(view,arg);
}

let pin="", busy=false;
function bind(view,arg){
 scr.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>render(b.dataset.go,b.dataset.a));
 if(view==="lock"){
  const dots=[...scr.querySelectorAll(".dots span")];
  const draw=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<pin.length));
  scr.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
   if(busy) return;
   const k=b.dataset.k; $("#dots").classList.remove("err"); $("#lm").textContent="";
   if(k==="⌫"){pin=pin.slice(0,-1);draw();return}
   if(pin.length<4){pin+=k;draw()}
   if(pin.length===4){
    busy=true; const txt=await tryDecrypt(PAYLOAD,pin); busy=false;
    if(txt){D=JSON.parse(txt);store.set("g_pin",pin);pin="";render("home")}
    else{$("#dots").classList.add("err");$("#lm").textContent="PIN errato";pin="";setTimeout(draw,350)}
   }
  });
 }
 if(view==="nota"){
  const f=$("#nf"); if(f) f.onsubmit=async e=>{e.preventDefault();
   const n=D.notes.find(x=>x.id===arg); const code=$("#ncode").value.trim();
   const txt=await tryDecrypt(n.enc,code);
   if(txt!=null){opened[n.id]=txt;store.set("g_note_"+n.id,code);render("nota",arg)}
   else $("#nerr").textContent="Codice errato";};
 }
}

async function restore(){
 const p=store.get("g_pin");
 if(p){const txt=await tryDecrypt(PAYLOAD,p); if(txt){D=JSON.parse(txt);
  for(const n of D.notes){if(n.enc){const c=store.get("g_note_"+n.id); if(c){const t=await tryDecrypt(n.enc,c); if(t!=null) opened[n.id]=t}}}}}
 render(D?"home":"lock");
}
render("lock"); restore();
</script>
